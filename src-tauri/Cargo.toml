[package]
name = "account-desk"
version = "0.1.6"
edition = "2021"
description = "Local account vault for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
aes-gcm = "0.10"
clipboard-win = { version = "5.4", features = ["std"] }
argon2 = "0.5"
fs2 = "0.4"
data-encoding = "2"
hmac = "0.12"
open = "5"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive", "serde"] }

[profile.release]
opt-level = 1

[profile.release.package.account-desk]
opt-level = 0
